<!doctype html>
<html lang="pl" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta id="theme-color" name="theme-color" content="#101411" data-dark="#101411" data-light="#f3f7f2" />
    <script>
      try {
        if (localStorage.getItem('portfolio-theme') === 'light') {
          document.documentElement.dataset.theme = 'light';
          const themeColor = document.getElementById('theme-color');
          themeColor.content = themeColor.dataset.light;
        }
      } catch {}
    </script>
    <meta name="description" content="Portfolio Sebastiana Szyszły. Projekty z elektroniki, przetwarzania sygnałów i programowania." />
    <title>Sebastian Szyszło · Portfolio</title>
    <link rel="icon" type="image/svg+xml" href="/src/monogram.svg" />
  </head>
  <body>
    <div id="root"></div>
    <noscript><p>Sebastian Szyszło · Portfolio. Włącz JavaScript, aby przejrzeć projekty.</p></noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
